<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>合约市场信号提醒与人工决策辅助</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17201d;
        --muted: #64716d;
        --line: #d9e1dd;
        --paper: #f7faf8;
        --panel: #ffffff;
        --teal: #087f73;
        --teal-soft: #dff4ef;
        --red: #b42318;
        --red-soft: #ffe7e2;
        --amber: #996a13;
        --amber-soft: #fff0c9;
        --blue: #265ea8;
        --blue-soft: #e6f0ff;
        --shadow: 0 16px 40px rgba(23, 32, 29, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Aptos", "Segoe UI", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background:
          linear-gradient(135deg, rgba(8, 127, 115, 0.09), transparent 34%),
          linear-gradient(315deg, rgba(153, 106, 19, 0.11), transparent 38%),
          var(--paper);
      }

      button,
      input {
        font: inherit;
      }

      button:disabled {
        cursor: progress;
        opacity: 0.66;
      }

      .shell {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 30px 0 48px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 22px;
      }

      .title {
        display: grid;
        gap: 6px;
      }

      h1 {
        margin: 0;
        font-size: clamp(26px, 4vw, 44px);
        line-height: 1.08;
        letter-spacing: 0;
      }

      .subtitle {
        color: var(--muted);
        margin: 0;
        font-size: 15px;
      }

      .controls {
        display: grid;
        grid-template-columns: minmax(190px, 270px) auto auto auto;
        gap: 10px;
        align-items: center;
      }

      .secret {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        min-height: 42px;
        padding: 0 12px;
        color: var(--ink);
      }

      .button {
        border: 0;
        border-radius: 8px;
        min-height: 42px;
        padding: 0 16px;
        background: var(--ink);
        color: white;
        cursor: pointer;
        font-weight: 700;
        white-space: nowrap;
      }

      .button.secondary {
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--line);
      }

      .status-line {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 14px;
      }

      .status-line span:not(.pill) {
        min-height: 30px;
        display: inline-flex;
        align-items: center;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 30px;
        padding: 0 10px;
        border-radius: 999px;
        font-weight: 700;
        background: var(--blue-soft);
        color: var(--blue);
      }

      .pill.ok {
        background: var(--teal-soft);
        color: var(--teal);
      }

      .pill.warn {
        background: var(--amber-soft);
        color: var(--amber);
      }

      .pill.bad {
        background: var(--red-soft);
        color: var(--red);
      }

      .grid {
        display: grid;
        gap: 16px;
      }

      .metrics {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .metric {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        padding: 18px;
        min-height: 122px;
      }

      .metric span {
        color: var(--muted);
        font-size: 13px;
      }

      .metric strong {
        display: block;
        margin-top: 12px;
        font-size: 28px;
        line-height: 1;
      }

      .section {
        margin-top: 18px;
        background: rgba(255, 255, 255, 0.74);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }

      .release-policy {
        padding: 18px;
        background: var(--teal-soft);
      }

      .release-policy p {
        margin: 8px 0 0;
        color: var(--ink);
        line-height: 1.6;
      }

      .policy-flags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
      }

      summary.section-head {
        cursor: pointer;
        list-style: none;
      }

      summary.section-head::-webkit-details-marker {
        display: none;
      }

      details:not([open]) .section-head {
        border-bottom: 0;
      }

      .section-title {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .toggle-hint {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      h2 {
        margin: 0;
        font-size: 18px;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 900px;
        background: var(--panel);
      }

      th,
      td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
        font-size: 14px;
      }

      th {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        background: #f3f7f5;
      }

      .empty,
      .error {
        padding: 22px;
        color: var(--muted);
        background: var(--panel);
      }

      .error {
        color: var(--red);
      }

      .mobile-cards {
        display: none;
      }

      .signal-feed {
        background: var(--panel);
      }

      .performance-summary {
        padding: 16px 18px 18px;
        background: var(--panel);
      }

      .performance-core,
      .performance-secondary {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }

      .performance-core {
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }

      .performance-card {
        min-width: 0;
        padding: 14px;
        border-right: 1px solid var(--line);
      }

      .performance-card:last-child {
        border-right: 0;
      }

      .performance-label,
      .performance-meta,
      .performance-note,
      .performance-calculated-at {
        color: var(--muted);
      }

      .performance-label {
        display: block;
        font-size: 12px;
        font-weight: 700;
      }

      .performance-value {
        display: block;
        margin-top: 8px;
        font-size: 24px;
        line-height: 1;
        font-weight: 800;
        overflow-wrap: anywhere;
      }

      .performance-meta {
        display: block;
        margin-top: 7px;
        font-size: 11px;
        line-height: 1.35;
      }

      .performance-value.positive {
        color: var(--teal);
      }

      .performance-value.negative {
        color: var(--red);
      }

      .performance-secondary {
        margin-top: 12px;
        background: #f7f9f8;
        border-radius: 8px;
      }

      .performance-secondary-item {
        min-width: 0;
        padding: 11px 12px;
      }

      .performance-secondary-item .performance-value {
        margin-top: 5px;
        font-size: 17px;
      }

      .performance-note {
        margin: 12px 0 0;
        font-size: 12px;
        line-height: 1.5;
      }

      .performance-calculated-at {
        font-size: 12px;
        white-space: nowrap;
      }

      .signal-item {
        border-bottom: 1px solid var(--line);
      }

      .signal-item:last-child {
        border-bottom: 0;
      }

      .signal-item[open] {
        background: #fbfdfc;
      }

      .signal-summary {
        display: grid;
        grid-template-columns: minmax(240px, 1.25fr) 104px minmax(230px, 1fr) minmax(150px, 0.7fr) auto;
        grid-template-areas: "identity time prices review more";
        gap: 14px;
        align-items: center;
        padding: 14px 18px;
        cursor: pointer;
        list-style: none;
      }

      .signal-summary::-webkit-details-marker {
        display: none;
      }

      .signal-identity {
        grid-area: identity;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 7px;
        min-width: 0;
      }

      .signal-asset {
        font-weight: 800;
        letter-spacing: 0.01em;
        overflow-wrap: anywhere;
      }

      .signal-tag {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        line-height: 1.25;
        font-weight: 800;
      }

      .signal-tag.long {
        color: #18794e;
        background: #e5f4eb;
      }

      .signal-tag.short {
        color: var(--red);
        background: var(--red-soft);
      }

      .signal-tag.neutral {
        color: var(--muted);
        background: #edf1ef;
      }

      .signal-tag.tier-watch {
        color: #48637e;
        background: #edf3f8;
      }

      .signal-tag.tier-observation {
        color: #716342;
        background: #f4f0e7;
      }

      .signal-tag.tier-muted {
        color: #626c68;
        background: #eff2f1;
      }

      .signal-time {
        grid-area: time;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .signal-prices {
        grid-area: prices;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 5px 9px;
        min-width: 0;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }

      .signal-price-flow {
        color: var(--ink);
      }

      .signal-drift {
        color: var(--muted);
        font-weight: 700;
      }

      .signal-review {
        grid-area: review;
        font-size: 13px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }

      .signal-review.positive {
        color: #18794e;
      }

      .signal-review.negative {
        color: var(--red);
      }

      .signal-review.neutral {
        color: var(--muted);
      }

      .signal-more {
        grid-area: more;
        justify-self: end;
        color: var(--teal);
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }

      .signal-more::after {
        content: "›";
        display: inline-block;
        margin-left: 4px;
        transition: transform 0.16s ease;
      }

      .signal-item[open] .signal-more::after {
        transform: rotate(90deg);
      }

      .signal-detail {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px 18px;
        padding: 14px 18px 18px;
        border-top: 1px solid #e8eeeb;
      }

      .signal-detail-item {
        min-width: 0;
      }

      .signal-detail-item.wide {
        grid-column: 1 / -1;
      }

      .signal-detail-label {
        display: block;
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }

      .signal-detail-value {
        display: block;
        font-size: 13px;
        line-height: 1.55;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      @media (max-width: 920px) {
        .performance-core,
        .performance-secondary {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .performance-card:nth-child(3n) {
          border-right: 0;
        }

        .performance-card:nth-child(-n + 3) {
          border-bottom: 1px solid var(--line);
        }

        .signal-summary {
          grid-template-columns: minmax(0, 1fr) auto;
          grid-template-areas:
            "identity time"
            "prices prices"
            "review more";
          row-gap: 9px;
        }

        .signal-detail {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 840px) {
        .topbar {
          align-items: stretch;
          flex-direction: column;
        }

        .controls {
          grid-template-columns: 1fr;
        }

        .metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 560px) {
        .shell {
          width: min(100% - 20px, 1180px);
          padding-top: 18px;
        }

        .metrics {
          grid-template-columns: 1fr;
        }

        .performance-summary {
          padding: 12px;
        }

        .performance-core,
        .performance-secondary {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .performance-card:nth-child(3n) {
          border-right: 1px solid var(--line);
        }

        .performance-card:nth-child(2n) {
          border-right: 0;
        }

        .performance-card:nth-child(-n + 4) {
          border-bottom: 1px solid var(--line);
        }

        .performance-secondary-item {
          padding: 10px;
        }

        .performance-calculated-at {
          white-space: normal;
          text-align: right;
        }

        .desktop-table {
          display: none;
        }

        .mobile-cards {
          display: grid;
          gap: 10px;
          padding: 10px;
          background: var(--panel);
        }

        .row-card {
          border: 1px solid var(--line);
          border-radius: 8px;
          padding: 12px;
          display: grid;
          gap: 8px;
        }

        .signal-summary {
          grid-template-areas:
            "identity time"
            "prices prices"
            "review review"
            "more more";
          column-gap: 8px;
          padding: 13px 12px;
        }

        .signal-time {
          justify-self: end;
          font-size: 11px;
        }

        .signal-more {
          margin-top: 1px;
        }

        .signal-detail {
          grid-template-columns: 1fr;
          padding: 13px 12px 16px;
        }

        .signal-detail-item.wide {
          grid-column: auto;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="title">
          <h1>合约市场信号提醒与人工决策辅助</h1>
          <p class="subtitle">扫描市场、发现机会、记录信号与后续表现；所有交易决定均由用户人工完成。</p>
        </div>
        <form class="controls" id="statusForm">
          <input class="secret" id="secretInput" type="password" autocomplete="current-password" placeholder="输入查询密码" />
          <button class="button" type="submit">查询</button>
          <button class="button secondary" id="clearButton" type="button">清除密钥</button>
        </form>
      </header>

      <div class="status-line">
        <span class="pill warn" id="connectionState">等待查询</span>
        <span id="lastRefresh">尚未刷新</span>
        <span id="warningText"></span>
      </div>

      <section class="section release-policy" aria-label="Signal-only policy">
        <strong>Signal-only 运行边界</strong>
        <p>本系统仅提供市场信号和数据分析，不自动开仓、不自动下单、不自动设置仓位或平仓。是否交易、仓位、止盈止损和平仓均由用户自行人工决定。</p>
        <div class="policy-flags" id="policyFlags"></div>
      </section>

      <section class="grid metrics" aria-label="运行概览">
        <div class="metric"><span>最近执行</span><strong id="latestRun">--</strong></div>
        <div class="metric"><span>最近分组</span><strong id="latestGroup">--</strong></div>
        <div class="metric"><span>是否触发策略</span><strong id="latestSignal">--</strong></div>
        <div class="metric"><span>是否发送邮件</span><strong id="latestEmail">--</strong></div>
      </section>

      <section class="section" aria-label="信号密度 KPI">
        <div class="section-head">
          <h2>信号密度 KPI（人工决策辅助）</h2>
        </div>
        <div class="grid metrics" id="signalDensityKpi"></div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>分组状态</h2>
          <span class="pill" id="groupCount">0 组</span>
        </div>
        <div id="groupSummary"></div>
      </section>

      <section class="section">
        <details id="runLogDetails">
          <summary class="section-head">
            <span class="section-title">
              <h2>最近执行记录</h2>
              <span class="toggle-hint">点击展开/收起</span>
            </span>
            <span class="pill" id="runCount">0 条</span>
          </summary>
          <div id="runLogs"></div>
        </details>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>历史复盘汇总</h2>
          <span class="performance-calculated-at" id="performanceCalculatedAt">--</span>
        </div>
        <div id="performanceSummary">
          <div class="empty">查询后显示全部历史信号的复盘汇总。</div>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>最近信号记录</h2>
          <span class="pill" id="alertCount">0 条</span>
        </div>
        <div id="sentAlerts"></div>
      </section>
    </main>

    <script>
      const GROUP_LABELS = {
        "crypto-core-a": "主流币 A",
        "crypto-core-b": "主流币 B",
        "crypto-alt-a": "山寨币 A",
        "crypto-alt-b": "山寨币 B",
        "crypto-alt-c": "山寨币 C",
        "futures-core": "合约趋势",
        "futures-arbitrage": "合约套利",
        "v3-paper": "V3.1 静默基准",
        "v3-3-paper": "V3.3 过渡复盘",
        "v3-4-paper": "V3.4 统一策略",
      };

      Object.assign(GROUP_LABELS, {
        "dynamic-spot": "动态强势池",
        "dynamic-weak-spot": "动态弱势池",
        "crypto-core-a-1h": "主流币 A 1h",
        "crypto-core-b-1h": "主流币 B 1h",
        "crypto-alt-a-1h": "山寨币 A 1h",
        "crypto-alt-b-1h": "山寨币 B 1h",
        "crypto-alt-c-1h": "山寨币 C 1h",
        "futures-scalp-a": "合约短线 A 15m/30m",
        "futures-scalp-b": "合约短线 B 15m/30m",
        "futures-core-1h": "合约趋势 1h",
        "crypto-core-a-mid": "主流币 A 2h/4h",
        "crypto-core-b-mid": "主流币 B 2h/4h",
        "crypto-alt-a-mid": "山寨币 A 2h/4h",
        "crypto-alt-b-mid": "山寨币 B 2h/4h",
        "crypto-alt-c-mid": "山寨币 C 2h/4h",
        "futures-core-mid": "合约趋势 2h/4h",
        "crypto-core-a-daily": "主流币 A 日线",
        "crypto-core-b-daily": "主流币 B 日线",
        "crypto-alt-a-daily": "山寨币 A 日线",
        "crypto-alt-b-daily": "山寨币 B 日线",
        "crypto-alt-c-daily": "山寨币 C 日线",
        "crypto-daily": "虚拟货币日线",
        "futures-daily": "合约日线",
      });

      const els = {
        form: document.querySelector("#statusForm"),
        secret: document.querySelector("#secretInput"),
        clear: document.querySelector("#clearButton"),
        state: document.querySelector("#connectionState"),
        lastRefresh: document.querySelector("#lastRefresh"),
        warningText: document.querySelector("#warningText"),
        latestRun: document.querySelector("#latestRun"),
        latestGroup: document.querySelector("#latestGroup"),
        latestSignal: document.querySelector("#latestSignal"),
        latestEmail: document.querySelector("#latestEmail"),
        groupSummary: document.querySelector("#groupSummary"),
        runLogs: document.querySelector("#runLogs"),
        sentAlerts: document.querySelector("#sentAlerts"),
        performanceSummary: document.querySelector("#performanceSummary"),
        performanceCalculatedAt: document.querySelector("#performanceCalculatedAt"),
        groupCount: document.querySelector("#groupCount"),
        runCount: document.querySelector("#runCount"),
        alertCount: document.querySelector("#alertCount"),
        policyFlags: document.querySelector("#policyFlags"),
        signalDensityKpi: document.querySelector("#signalDensityKpi")
      };

      const savedSecret = sessionStorage.getItem("signal-dashboard-secret");
      if (savedSecret) els.secret.value = savedSecret;

      els.form.addEventListener("submit", (event) => {
        event.preventDefault();
        loadStatus();
      });

      els.clear.addEventListener("click", () => {
        sessionStorage.removeItem("signal-dashboard-secret");
        els.secret.value = "";
        setState("warn", "等待查询");
      });

      if (savedSecret) loadStatus();

      async function loadStatus() {
        const secret = els.secret.value.trim();
        if (!secret) {
          setState("bad", "需要密钥");
          return;
        }
        sessionStorage.setItem("signal-dashboard-secret", secret);
        setState("warn", "查询中");

        try {
          const response = await fetch("/api/status?limit=80&alertLimit=120", {
            headers: { Authorization: `Bearer ${secret}` },
            cache: "no-store"
          });
          const data = await response.json();
          if (response.status === 401) throw new Error("查询密码不正确或已更新");
          if (!response.ok || !data.ok) throw new Error(data.message || data.error || `HTTP ${response.status}`);
          render(data);
          setState("ok", "连接正常");
        } catch (error) {
          setState("bad", "查询失败");
          els.runLogs.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
        }
      }

      function render(data) {
        const summary = data.summary || {};
        els.lastRefresh.textContent = `页面刷新：${formatDate(data.generatedAt)}`;
        els.warningText.textContent = Array.isArray(data.warnings) && data.warnings.length
          ? `部分数据不可用：${data.warnings.map((warning) => warning.source).join("、")}`
          : "";
        els.latestRun.textContent = summary.latestRunAt ? relativeTime(summary.latestRunAt) : "--";
        els.latestGroup.textContent = labelGroup(summary.latestScanGroup);
        els.latestSignal.textContent = summary.latestRunHadSignal ? "是" : "否";
        els.latestEmail.textContent = emailText(summary.latestRunEmailed, summary.latestRunEmailConsistency);
        els.groupCount.textContent = `${summary.groups?.length || 0} 组`;
        els.runCount.textContent = `${data.runLogs?.length || 0} 条`;
        const emailNotifications = data.emailNotifications || data.sentAlerts || [];
        els.alertCount.textContent = `${emailNotifications.length} 条`;
        renderReleasePolicy(data.signalOnly || {});
        renderSignalDensity(data.signalDensity || summary.signalDensity || {});
        renderGroupsV2(summary.groups || []);
        renderRuns(data.runLogs || []);
        renderPerformanceSummary(data.performanceSummary);
        renderAlertsV2(emailNotifications);
      }

      function renderPerformanceSummary(summary) {
        if (!summary || typeof summary !== "object") {
          els.performanceCalculatedAt.textContent = "--";
          els.performanceSummary.innerHTML = `<div class="empty">历史复盘汇总暂不可用。</div>`;
          return;
        }

        els.performanceCalculatedAt.textContent = summary.calculatedAt
          ? `计算于 ${formatDate(summary.calculatedAt)}`
          : "--";
        const primary = [
          ["总信号", summaryCount(summary.totalSignals), "", ""],
          ["已复盘", summaryCount(summary.reviewedSignals), summaryPercent(summary.reviewRate), ""],
          ["盈利", summaryCount(summary.profitSignals), "", "positive"],
          ["亏损", summaryCount(summary.lossSignals), "", "negative"],
          ["胜率", summaryPercent(summary.winRate), "", ""],
          ["总体盈亏", summaryReturn(summary.netSignalReturn), "等权信号累计", returnTone(summary.netSignalReturn)]
        ];
        const secondary = [
          ["待复盘", summaryCount(summary.pendingSignals), "", ""],
          ["盈利币种", summaryCount(summary.profitableAssets), "", "positive"],
          ["总币种", summaryCount(summary.totalAssets), "", ""],
          ["平均每笔", summaryReturn(summary.averageSignalReturn), "", returnTone(summary.averageSignalReturn)],
          ["PF", summaryProfitFactor(summary.profitFactor), "", profitFactorTone(summary.profitFactor)],
          [
            "PAPER 组合",
            summaryReturn(summary.paperPortfolioReturn),
            `${summaryCount(summary.reviewedPaperRuns)} 已复盘 / ${summaryCount(summary.profitablePaperRuns)} 盈利 / ${summaryCount(summary.losingPaperRuns)} 亏损`,
            returnTone(summary.paperPortfolioReturn)
          ]
        ];

        els.performanceSummary.innerHTML = `<div class="performance-summary">
          <div class="performance-core">${primary.map(renderPerformanceCard).join("")}</div>
          <div class="performance-secondary">${secondary.map(renderPerformanceSecondary).join("")}</div>
          <p class="performance-note">等权信号收益用于衡量信号整体质量，不代表真实账户资金曲线。PAPER 组合数据为“PAPER 组合周期累计”，按唯一模型与调仓周期统计，不与单笔信号收益混算。</p>
        </div>`;
      }

      function renderPerformanceCard([label, value, meta, tone]) {
        return `<div class="performance-card">
          <span class="performance-label">${escapeHtml(label)}</span>
          <strong class="performance-value ${escapeHtml(tone)}">${escapeHtml(value)}</strong>
          ${meta ? `<span class="performance-meta">${escapeHtml(meta)}</span>` : ""}
        </div>`;
      }

      function renderPerformanceSecondary([label, value, meta, tone]) {
        return `<div class="performance-secondary-item">
          <span class="performance-label">${escapeHtml(label)}</span>
          <strong class="performance-value ${escapeHtml(tone)}">${escapeHtml(value)}</strong>
          ${meta ? `<span class="performance-meta">${escapeHtml(meta)}</span>` : ""}
        </div>`;
      }

      function summaryCount(value) {
        const number = summaryNumber(value);
        return number != null && number >= 0 ? String(number) : "--";
      }

      function summaryPercent(value) {
        const number = summaryNumber(value);
        return number != null ? `${(number * 100).toFixed(2)}%` : "--";
      }

      function summaryReturn(value) {
        const number = summaryNumber(value);
        if (number == null) return "--";
        const sign = number > 0 ? "+" : "";
        return `${sign}${(number * 100).toFixed(2)}%`;
      }

      function summaryProfitFactor(value) {
        const number = summaryNumber(value);
        return number != null ? number.toFixed(3) : "--";
      }

      function returnTone(value) {
        const number = summaryNumber(value);
        return number != null ? (number > 0 ? "positive" : number < 0 ? "negative" : "") : "";
      }

      function profitFactorTone(value) {
        const number = summaryNumber(value);
        return number != null ? (number >= 1 ? "positive" : "negative") : "";
      }

      function summaryNumber(value) {
        if (value == null || value === "") return null;
        const number = Number(value);
        return Number.isFinite(number) ? number : null;
      }

      function renderSignalDensity(kpi) {
        const fields = [
          ["近 7 天信号", kpi.signalsLast7d],
          ["近 30 天信号", kpi.signalsLast30d],
          ["近 30 天 TRADE_WATCH", kpi.tradeWatchLast30d],
          ["近 30 天 Strong OBSERVATION", kpi.strongObservationLast30d],
          ["近 30 天 SHADOW_ONLY", kpi.shadowLast30d],
          ["近 30 天研究阻断", kpi.researchBlockedLast30d],
          ["Strong rank 1–10", kpi.strongRank1To10Last30d],
          ["Strong rank 11–25", kpi.strongRank11To25Last30d]
        ];
        els.signalDensityKpi.innerHTML = fields
          .map(([label, value]) => `<div class="metric"><span>${escapeHtml(label)}</span><strong>${escapeHtml(String(Number(value) || 0))}</strong></div>`)
          .join("");
      }

      function renderAlertsV2(alerts) {
        if (!alerts.length) {
          els.sentAlerts.innerHTML = `<div class="empty">最近没有信号记录。</div>`;
          return;
        }
        els.sentAlerts.innerHTML = `<div class="signal-feed">${alerts.map(renderAlertCard).join("")}</div>`;
      }

      function renderAlertCard(alert) {
        const payload = alert.payload || {};
        const direction = directionText(payload);
        const tier = tierText(payload);
        const review = reviewSummary(payload.review);
        const tradeSpec = payload.tradeSpec;
        const executionPlan = payload.executionPlan;
        const referencePrice = tradeSpec?.referencePrice ?? executionPlan?.referencePrice ?? payload.close;
        const riskDetails = executionPlan?.kind === "v3_paper_position"
          ? [["执行计划与参考风险", executionPlanText(executionPlan), true]]
          : tradeSpec
            ? [
                ["止损", formatNumber(tradeSpec.stopLoss)],
                ["止盈", formatNumber(tradeSpec.takeProfit)],
                ["参考风险", referenceRiskText(payload), true]
              ]
            : [["参考风险", referenceRiskText(payload), true]];
        const detailItems = [
          ["信号生成时间", formatDate(payload.signalAvailableAt || alert.trigger_time)],
          ["模型版本", alert.model_version || payload.modelVersion || "--"],
          ["触发原因", payload.triggerReason || "--", true],
          ["失效条件", payload.invalidCondition || "--", true],
          ["历史样本状态", payload.historicalSampleStatus || "仅供参考，未构成盈利保证", true],
          ["投递", deliveryText(alert, payload)],
          ...riskDetails,
          ["完整复盘", reviewText(payload.review), true]
        ];

        return `<details class="signal-item">
          <summary class="signal-summary">
            <span class="signal-identity">
              <span class="signal-asset">${escapeHtml(displayText(alert.asset))}</span>
              <span class="signal-tag ${directionClass(direction)}">${escapeHtml(direction)}</span>
              <span class="signal-tag ${tierClass(tier)}" aria-label="信号级别">${escapeHtml(tier)}</span>
            </span>
            <span class="signal-time">${escapeHtml(formatDate(alert.sent_at || alert.trigger_time))}</span>
            <span class="signal-prices">
              <span class="signal-price-flow">参考 ${escapeHtml(formatNumber(referencePrice))} → 当前 ${escapeHtml(formatNumber(payload.currentPrice))}</span>
              <span class="signal-drift" aria-label="价格漂移">${escapeHtml(pct(payload.priceDriftPct))}</span>
            </span>
            <span class="signal-review ${review.tone}">${escapeHtml(review.text)}</span>
            <span class="signal-more">查看详情</span>
          </summary>
          <div class="signal-detail">${detailItems.map(([label, value, wide]) => `
            <div class="signal-detail-item${wide ? " wide" : ""}">
              <span class="signal-detail-label">${escapeHtml(label)}</span>
              <span class="signal-detail-value">${escapeHtml(displayText(value))}</span>
            </div>`).join("")}
          </div>
        </details>`;
      }

      function reviewSummary(review) {
        if (review?.status === "reviewed") {
          if (isFiniteValue(review.returnPct)) {
            return returnSummary("已复盘", review.returnPct);
          }
          return { text: "已复盘", tone: "neutral" };
        }
        if (review?.status === "pending" && isFiniteValue(review.returnPct)) {
          return returnSummary("监控中", review.returnPct);
        }
        if (review?.status === "pending" && isFiniteValue(review.latestMarkedReturn)) {
          return returnSummary("组合监控中", review.latestMarkedReturn);
        }
        return { text: "待复盘", tone: "neutral" };
      }

      function returnSummary(label, value) {
        const number = Number(value);
        return {
          text: `${label} ${signedPct(number)}`,
          tone: number > 0 ? "positive" : number < 0 ? "negative" : "neutral"
        };
      }

      function isFiniteValue(value) {
        return value != null && Number.isFinite(Number(value));
      }

      function signedPct(value) {
        const formatted = pct(value);
        return Number(value) > 0 ? `+${formatted}` : formatted;
      }

      function directionClass(direction) {
        if (direction === "LONG") return "long";
        if (direction === "SHORT") return "short";
        return "neutral";
      }

      function tierClass(tier) {
        const value = String(tier).toUpperCase();
        if (value.includes("TRADE_WATCH") || value.includes("TRADE WATCH")) return "tier-watch";
        if (value.includes("OBSERVATION") || value.includes("观察")) return "tier-observation";
        return "tier-muted";
      }

      function renderReleasePolicy(policy) {
        const flags = [
          ["自动交易", policy.autoTrading === false ? "关闭" : "需核验", policy.autoTrading === false],
          ["下单路径", policy.orderPlacement === false ? "关闭" : "需核验", policy.orderPlacement === false],
          ["仓位管理", policy.positionManagement === false ? "关闭" : "需核验", policy.positionManagement === false],
          ["重复信号保护", policy.duplicateSignalProtection ? "开启" : "需核验", policy.duplicateSignalProtection],
          ["已处理 K 线保护", policy.processedCandleProtection ? "开启" : "需核验", policy.processedCandleProtection],
          ["当前价漂移保护", policy.currentPriceGuard ? "开启" : "需核验", policy.currentPriceGuard]
        ];
        els.policyFlags.innerHTML = flags
          .map(([label, value, ok]) => `<span class="pill ${ok ? "ok" : "bad"}">${escapeHtml(label)}：${escapeHtml(value)}</span>`)
          .join("");
      }

      function renderGroupsV2(groups) {
        if (!groups.length) {
          els.groupSummary.innerHTML = `<div class="empty">还没有分组执行记录。</div>`;
          return;
        }
        els.groupSummary.innerHTML = table(
          ["分组", "说明", "最近执行", "运行次数", "候选 最新/累计", "信号 最新/累计", "已确认邮件", "待核查邮件", "警告 最新/历史", "错误 最新/历史"],
          groups.map((group) => [
            group.group,
            labelGroup(group.group),
            formatDate(group.lastRun),
            group.runs,
            `${Number(group.latestCandidates || 0)} / ${Number(group.candidates || 0)}`,
            `${Number(group.latestSignals || 0)} / ${Number(group.signals || 0)}`,
            badge(group.emails > 0, group.emails > 0 ? `${group.emails} 次` : "无"),
            badge(group.unverifiedEmails === 0, group.unverifiedEmails === 0 ? "无" : `${group.unverifiedEmails} 次`, true, "warn"),
            statusPair(group.warnings, group.totalWarnings, "warn"),
            statusPair(group.errors, group.totalErrors, "bad")
          ])
        );
      }

      function statusPair(latest, total, badClass) {
        const latestCount = Number(latest || 0);
        const totalCount = Number(total || 0);
        const text = latestCount === 0 && totalCount === 0 ? "无" : `${latestCount} / ${totalCount}`;
        return badge(latestCount === 0, text, true, badClass);
      }

      function renderGroups(groups) {
        if (!groups.length) {
          els.groupSummary.innerHTML = `<div class="empty">还没有分组执行记录。</div>`;
          return;
        }
        els.groupSummary.innerHTML = table(
          ["分组", "说明", "最近执行", "运行次数", "候选", "信号", "已确认邮件", "待核查邮件", "警告", "错误"],
          groups.map((group) => [
            group.group,
            labelGroup(group.group),
            formatDate(group.lastRun),
            group.runs,
            group.candidates,
            group.signals,
            badge(group.emails > 0, group.emails > 0 ? `${group.emails} 次` : "无"),
            badge(group.unverifiedEmails === 0, group.unverifiedEmails === 0 ? "无" : `${group.unverifiedEmails} 次`, true, "warn"),
            badge(group.warnings === 0, group.warnings === 0 ? "无" : `${group.warnings} 条`, true, "warn"),
            badge(group.errors === 0, group.errors === 0 ? "无" : `${group.errors} 条`, true)
          ])
        );
      }

      function renderRuns(runs) {
        if (!runs.length) {
          els.runLogs.innerHTML = `<div class="empty">还没有执行记录。请确认 GitHub Actions / Supabase 是否触发 /api/cron。</div>`;
          return;
        }
        els.runLogs.innerHTML = table(
          ["执行时间", "分组", "候选", "信号", "邮件", "邮件状态", "核验", "耗时", "警告", "错误"],
          runs.map((run) => [
            formatDate(run.created_at || run.finished_at || run.started_at),
            labelGroup(run.scan_group || "all"),
            Number(run.candidates_count || 0),
            Number(run.signals_count || 0),
            badge(Boolean(run.emailed), run.emailed ? "流程已发送" : "未发送"),
            run.email_status || "--",
            renderEmailConsistency(run.email_consistency),
            duration(run.started_at, run.finished_at),
            renderWarnings(run.warnings),
            renderErrors(run.errors)
          ])
        );
      }

      function renderAlerts(alerts) {
        if (!alerts.length) {
          els.sentAlerts.innerHTML = `<div class="empty">最近没有邮件提醒记录。</div>`;
          return;
        }
        els.sentAlerts.innerHTML = table(
          ["发送时间", "资产", "市场", "周期", "策略", "推荐指数", "评分拆解", "已发复盘", "历史表现", "触发时间"],
          alerts.map((alert) => [
            formatDate(alert.sent_at),
            alert.asset || "--",
            alert.payload?.market || "--",
            alert.interval || "--",
            alert.payload?.strategyName || alert.strategy_id || "--",
            alert.recommendation_score == null ? "--" : Math.round(Number(alert.recommendation_score)),
            scoringBreakdownText(alert.payload?.scoringBreakdown),
            reviewText(alert.payload?.review),
            historyPerformanceText(alert.payload?.livePerformance),
            formatDate(alert.trigger_time)
          ])
        );
      }

      function table(headers, rows) {
        const head = headers.map((item) => `<th>${escapeHtml(item)}</th>`).join("");
        const body = rows.map((row) => `<tr>${row.map((cell) => `<td>${cellHtml(cell)}</td>`).join("")}</tr>`).join("");
        const cards = rows
          .map((row) => `<article class="row-card">${headers.map((header, i) => `<div><strong>${escapeHtml(header)}：</strong>${cellHtml(row[i])}</div>`).join("")}</article>`)
          .join("");
        return `<div class="table-wrap desktop-table"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div><div class="mobile-cards">${cards}</div>`;
      }

      function badge(ok, text, invert = false, invertClass = "bad") {
        const cls = ok ? "ok" : invert ? invertClass : "warn";
        return { html: `<span class="pill ${cls}">${escapeHtml(text)}</span>` };
      }

      function renderWarnings(warnings) {
        if (!Array.isArray(warnings) || warnings.length === 0) return badge(true, "无");
        return { html: `<details><summary><span class="pill warn">${warnings.length} 条</span></summary>${warningList(warnings)}</details>` };
      }

      function renderEmailConsistency(consistency) {
        const status = consistency?.status || "none";
        if (status === "verified") return badge(true, "已落库");
        if (status === "legacy_unverified") return badge(false, "旧记录未核验", true, "warn");
        if (status === "missing_sent_alert_record") return badge(false, "缺少提醒记录", true);
        return "--";
      }

      function emailText(emailed, consistency) {
        if (!emailed) return "否";
        const status = consistency?.status || "legacy_unverified";
        if (status === "verified") return "是";
        if (status === "missing_sent_alert_record") return "异常";
        return "待核查";
      }

      function renderErrors(errors) {
        if (!Array.isArray(errors) || errors.length === 0) return badge(true, "无");
        return { html: `<details><summary><span class="pill bad">${errors.length} 条</span></summary>${errorList(errors)}</details>` };
      }

      function warningList(warnings) {
        const grouped = new Map();
        for (const item of warnings) {
          const message = item.warning || item.error || item.message || item;
          const key = String(message);
          if (!grouped.has(key)) grouped.set(key, []);
          grouped.get(key).push(item.label || "数据源");
        }
        return `<ul>${[...grouped.entries()].slice(0, 8).map(([message, labels]) => {
          const labelText = labels.length > 1
            ? `${labels.length} 项：${labels.slice(0, 4).join("、")}${labels.length > 4 ? " 等" : ""}`
            : labels[0];
          return `<li>${escapeHtml(labelText)}：${escapeHtml(message)}</li>`;
        }).join("")}</ul>`;
      }

      function errorList(errors) {
        return `<ul>${errors.slice(0, 8).map((item) => `<li>${escapeHtml(item.label || "系统")}：${escapeHtml(item.error || item.message || item)}</li>`).join("")}</ul>`;
      }

      function cellHtml(value) {
        if (value && typeof value === "object" && "html" in value) return value.html;
        return escapeHtml(value);
      }

      function duration(start, end) {
        if (!start || !end) return "--";
        const ms = new Date(end).getTime() - new Date(start).getTime();
        if (!Number.isFinite(ms) || ms < 0) return "--";
        return `${Math.round(ms / 1000)} 秒`;
      }

      function formatDate(value) {
        if (!value) return "--";
        return new Intl.DateTimeFormat("zh-CN", {
          timeZone: "Asia/Shanghai",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }).format(new Date(value));
      }

      function relativeTime(value) {
        const diff = Date.now() - new Date(value).getTime();
        if (!Number.isFinite(diff)) return "--";
        const minutes = Math.max(0, Math.round(diff / 60000));
        if (minutes < 60) return `${minutes} 分钟前`;
        return `${Math.round(minutes / 60)} 小时前`;
      }

      function reviewText(review) {
        if (review?.status === "reviewed") {
          const outcome = review.outcome || "已复盘";
          const value = Number.isFinite(Number(review.returnPct)) ? ` ${pct(review.returnPct)}` : "";
          const exitReason = review.exitReason === "catastrophe_stop"
            ? " / 组合灾难止损"
            : review.exitReason === "time_exit"
              ? " / 168h 时间退出"
              : "";
          if (Number.isFinite(Number(review.priceReturn)) && Number.isFinite(Number(review.fundingReturn)) && Number.isFinite(Number(review.tradingCost))) {
            return `${outcome}${value}${exitReason} / 价格 ${pct(review.priceReturn)} / 资金费 ${pct(review.fundingReturn)} / 成本 -${pct(review.tradingCost)}`;
          }
          const price = Number.isFinite(Number(review.exitPrice)) ? ` / 退出 ${formatNumber(review.exitPrice)}` : "";
          return `${outcome}${value}${exitReason}${price}`;
        }
        if (review?.status === "pending") {
          const hasPositionReturn = review.returnPct != null
            && Number.isFinite(Number(review.returnPct));
          const hasPortfolioReturn = review.portfolioReturnPct != null
            && Number.isFinite(Number(review.portfolioReturnPct));
          const hasLatestPortfolioReturn = review.latestMarkedReturn != null
            && Number.isFinite(Number(review.latestMarkedReturn));
          if (hasPositionReturn) {
            const outcome = review.outcome || (Number(review.returnPct) >= 0 ? "持仓中盈利" : "持仓中亏损");
            const portfolio = hasPortfolioReturn
              ? ` / 组合 ${pct(review.portfolioReturnPct)}`
              : "";
            const markPrice = review.markPrice != null && Number.isFinite(Number(review.markPrice))
              ? ` / 标记价 ${formatNumber(review.markPrice)}`
              : "";
            const markTime = review.markTime ? ` / 更新 ${formatDate(review.markTime)}` : "";
            const expectedExit = review.expectedExitTime
              ? ` / 预计结束 ${formatDate(review.expectedExitTime)}`
              : "";
            return `${outcome} ${pct(review.returnPct)}${portfolio}${markPrice}${markTime}${expectedExit} / 未最终：${review.reason || "持仓监控中"}`;
          }
          if (hasLatestPortfolioReturn) {
            const outcome = Number(review.latestMarkedReturn) >= 0 ? "组合浮动盈利" : "组合浮动亏损";
            const markTime = review.latestMarkTime ? ` / 更新 ${formatDate(review.latestMarkTime)}` : "";
            const expectedExit = review.expectedExitTime
              ? ` / 预计结束 ${formatDate(review.expectedExitTime)}`
              : "";
            return `${outcome} ${pct(review.latestMarkedReturn)}${markTime}${expectedExit} / 未最终：${review.reason || "持仓监控中"}`;
          }
          return review.reason || "待复盘";
        }
        return "待复盘";
      }

      function historyPerformanceText(performance) {
        if (!performance) return "--";
        if (!performance.trades) return "同类已发样本不足";
        return `${pct(performance.winRate)} / ${performance.trades} 次 / ${pct(performance.totalReturn)}`;
      }

      function tierText(payload) {
        if (!payload) return "TRADE_WATCH / 高质量人工关注";
        if (payload.signalTierLabel) return displayText(payload.signalTierLabel);
        if (payload.alertTierLabel) return displayText(payload.alertTierLabel);
        if (payload.alertTier === "risk") return "风险级";
        if (payload.alertTier === "watch") return "观察级";
        return "TRADE_WATCH / 高质量人工关注";
      }

      function directionText(payload) {
        const value = `${displayText(payload?.direction, "")} ${displayText(payload?.strategyId, "")}`.toUpperCase();
        if (value.includes("做空") || value.includes("SHORT") || value.includes("空") || value.includes("下跌")) return "SHORT";
        if (value.includes("做多") || value.includes("LONG") || value.includes("多") || value.includes("上涨")) return "LONG";
        return "观察";
      }

      function deliveryText(alert, payload) {
        const mode = displayText(payload?.delivery?.mode || alert?.delivery_mode || "EMAIL");
        if (mode === "EMAIL") return "Email + Web";
        if (mode === "WEB") return "Web only";
        if (mode === "SHADOW_ONLY") return "Shadow record only";
        return mode;
      }

      function referenceRiskText(payload) {
        const spec = payload?.tradeSpec;
        if (!spec) return "REFERENCE ONLY / 用户人工决定";
        return `SL ${formatNumber(spec.stopLoss)} / TP ${formatNumber(spec.takeProfit)} / REFERENCE ONLY`;
      }

      function displayText(value, fallback = "--") {
        if (value == null || value === "") return fallback;
        if (typeof value === "string" || typeof value === "number" || typeof value === "boolean") return String(value);
        try {
          return JSON.stringify(value);
        } catch {
          return fallback;
        }
      }

      function executionPlanText(plan) {
        if (!plan) return "--";
        if (plan.kind === "v3_paper_position") {
          const side = plan.side === "LONG" ? "做多" : "做空";
          const baseWeight = plan.baseTargetWeight != null
            && Number.isFinite(Number(plan.baseTargetWeight))
            ? `基础 ${pct(Math.abs(Number(plan.baseTargetWeight)))} → `
            : "";
          const risk = plan.catastropheStopPct != null
            && Number.isFinite(Number(plan.catastropheStopPct))
            ? ` / 组合灾难止损 -${pct(plan.catastropheStopPct)}`
            : "";
          const holding = plan.maxHoldingHours != null
            && Number.isFinite(Number(plan.maxHoldingHours))
            ? ` / 最长 ${plan.maxHoldingHours}h / 无固定止盈`
            : "";
          return `${side} / ${baseWeight}权重 ${pct(Math.abs(Number(plan.targetWeight || 0)))} / 参考价 ${formatNumber(plan.referencePrice)}${risk}${holding}`;
        }
        return [
          `止损 ${formatNumber(plan.stopLoss)}`,
          `目标 ${formatNumber(plan.takeProfit)}`,
          `杠杆<=${formatNumber(plan.suggestedLeverage)}x`,
          plan.validFor || ""
        ].filter(Boolean).join(" / ");
      }

      function scoringBreakdownText(breakdown) {
        if (!breakdown) return "旧记录暂无";
        if (breakdown.kind === "v3_paper_position") {
          const volume = Number(breakdown.quoteVolume24h);
          const volumeText = Number.isFinite(volume) ? `${(volume / 1_000_000).toFixed(1)}m USDT` : "--";
          const forecast = Number(breakdown.forecastAnnualVolatility);
          const target = Number(breakdown.targetAnnualVolatility);
          const volatility = breakdown.forecastAnnualVolatility != null
            && breakdown.targetAnnualVolatility != null
            && Number.isFinite(forecast)
            && Number.isFinite(target)
            ? ` / 波动率预测 ${pct(forecast)} → 目标 ${pct(target)}`
            : "";
          return `分数 ${formatNumber(breakdown.score)} / beta ${formatNumber(breakdown.beta)} / 24h 量 ${volumeText}${volatility}`;
        }
        return `样本外 ${breakdown.outOfSample ?? "--"} / 环境 ${breakdown.environment ?? "--"} / 真实 ${breakdown.livePerformance ?? "--"} / 风险 ${breakdown.risk ?? "--"} / 成本 ${breakdown.costLiquidity ?? "--"} / 效率 ${breakdown.capitalEfficiency ?? "--"}`;
      }

      function pct(value) {
        const number = Number(value);
        if (!Number.isFinite(number)) return "N/A";
        return `${(number * 100).toFixed(Math.abs(number) >= 0.1 ? 1 : 2)}%`;
      }

      function formatNumber(value) {
        const number = Number(value);
        if (!Number.isFinite(number)) return "N/A";
        if (Math.abs(number) >= 100) return number.toFixed(2);
        if (Math.abs(number) >= 1) return number.toFixed(4).replace(/\.?0+$/, "");
        return number.toPrecision(4);
      }

      function labelGroup(group) {
        if (!group) return "--";
        if (String(group).startsWith("batch:")) return "批量扫描";
        return GROUP_LABELS[group] || group;
      }

      function setState(kind, text) {
        els.state.className = `pill ${kind}`;
        els.state.textContent = text;
      }

      function escapeHtml(value) {
        return String(value ?? "--").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        })[char]);
      }
    </script>
  </body>
</html>
